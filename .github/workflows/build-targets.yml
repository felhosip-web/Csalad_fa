name: Linux és Windows csomagolás

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: build-targets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Csomag készítése (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: Linux (x64)
            artifact: csaladfa-linux-x64
          - os: windows-latest
            label: Windows (x64)
            artifact: csaladfa-windows-x64

    steps:
      - name: Kódtár letöltése
        uses: actions/checkout@v4

      - name: Node.js 22 beállítása
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Frontend függőségek telepítése
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi

      - name: TypeScript ellenőrzés és production build
        run: |
          npx tsc --noEmit
          npm run build

      - name: Python 3.11 beállítása
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Pillow és PyInstaller telepítése
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow pyinstaller

      - name: Backend tesztek futtatása csomagolás előtt
        run: python -m unittest discover -s backend/tests -v

      - name: Asztali csomag összeállítása és füsttesztelése
        run: python packaging/build_bundle.py --version "${{ github.ref_name }}"

      - name: Elkészült csomag feltöltése artifactként
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: GitHub Release közzététele
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Csomagok letöltése
        uses: actions/download-artifact@v4
        with:
          path: dist-release
          merge-multiple: true

      - name: SHA-256 ellenőrzőösszegek létrehozása
        working-directory: dist-release
        run: sha256sum * > SHA256SUMS.txt

      - name: Kiadás létrehozása és csomagok csatolása
        uses: softprops/action-gh-release@v2
        with:
          files: dist-release/*
          generate_release_notes: true
          body: |
            ## Családfa – Önállóan futtatható kiadás (${{ github.ref_name }})

            Ez a kiadás tartalmazza a beépített React felületet és a helyi Python + SQLite (`.ftree`) háttérprogramot, így **nincs szükség külön Python vagy Node.js telepítésére**.

            - **Windows (64 bites):** töltsd le a `*-windows-x64.zip` fájlt, csomagold ki, majd kattints duplán a `Csaladfa.exe` fájlra.
            - **Linux (64 bites):** töltsd le a `*-linux-x64.tar.gz` fájlt, csomagold ki, majd futtasd a `./csaladfa` programot.
            - **Ellenőrzés:** a letöltött fájlok épsége a mellékelt `SHA256SUMS.txt` segítségével ellenőrizhető.

            Részletes, lépésről lépésre szóló magyar útmutató: `docs/terjesztes-linux-windows.md`.
