name: Folyamatos ellenőrzés (CI)

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Python backend tesztek (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Kódtár letöltése
        uses: actions/checkout@v4

      - name: Python 3.11 beállítása
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Pillow képkezelő telepítése
        run: python -m pip install --upgrade pip && python -m pip install pillow

      - name: Python backend tesztek futtatása (Linux)
        if: runner.os == 'Linux'
        run: python3 -m unittest discover -s backend/tests -v

      - name: Python backend tesztek futtatása (Windows)
        if: runner.os == 'Windows'
        run: python -m unittest discover -s backend/tests -v

  frontend-check:
    name: React és TypeScript ellenőrzés
    runs-on: ubuntu-latest
    steps:
      - name: Kódtár letöltése
        uses: actions/checkout@v4

      - name: Node.js 22 beállítása
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Frontend függőségek telepítése
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi

      - name: TypeScript típusellenőrzés
        run: npx tsc --noEmit

      - name: Production frontend build
        run: npm run build
